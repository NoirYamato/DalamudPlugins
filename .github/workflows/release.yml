# Pushing a tag vMAJOR.MINOR[.PATCH[.REVISION]] (e.g. v0.2.0) releases MitCue:
#   1. builds and tests exactly like ci.yml, with the plugin Version taken from the tag;
#   2. writes repo.json (the Dalamud "pluginmaster") whose download links point at this release's latest.zip,
#      and checks it and the zip with Dalamud's own manifest types (tools/RepoJsonCheck);
#   3. creates the GitHub release with latest.zip attached and checks that it downloads without signing in;
#   4. commits repo.json to the 'repo' branch, with published.json (the commit each listed build is from,
#      so that a re-run can be told apart from a different build under the same version). The custom
#      repository URL players add in Dalamud is
#      https://raw.githubusercontent.com/<owner>/<repo>/repo/repo.json (printed in the run summary).
# The GitHub repository must be public: Dalamud downloads repo.json and latest.zip anonymously.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  # One release at a time, so tags cannot race on the 'repo' branch. By default GitHub keeps only the
  # newest waiting run and cancels the others; queue: max keeps every pushed tag waiting for its turn.
  # Waiting runs may start in any order, and an older version that runs after a newer one is refused.
  group: release
  cancel-in-progress: false
  queue: max

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  DALAMUD_DISTRIB: https://goatcorp.github.io/dalamud-distrib
  PLUGIN: MitCue
  PACKAGE_DIR: src/MitCue/bin/Release/MitCue
  REPO_BRANCH: repo

jobs:
  release:
    name: Build, release and publish repo.json
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # create the release, upload latest.zip, push the 'repo' branch
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          # The token is passed only to the steps that need it, never to the build.
          persist-credentials: false

      - name: Read the version from the tag
        id: version
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          if [[ ! "$tag" =~ ^v([0-9]+\.[0-9]+(\.[0-9]+){0,2})$ ]]; then
            echo "::error::Tag '$tag' is not vMAJOR.MINOR[.PATCH[.REVISION]] (for example v0.2.0). Dalamud plugin versions are plain numbers."
            exit 1
          fi
          version="${BASH_REMATCH[1]}"
          IFS=. read -ra parts <<< "$version"
          for part in "${parts[@]}"; do
            if [ "${#part}" -gt 5 ] || [ "$part" -gt 65534 ]; then
              echo "::error::Version part '$part' is too large: .NET assembly version parts must be 0-65534."
              exit 1
            fi
          done
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing $PLUGIN $version from $tag"

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Look up the current Dalamud release
        id: dalamud
        run: |
          set -euo pipefail
          echo "DALAMUD_HOME=$RUNNER_TEMP/dalamud" >> "$GITHUB_ENV"
          version="$(curl -fsSL --retry 3 --retry-all-errors "$DALAMUD_DISTRIB/version" | jq -r '.AssemblyVersion // empty')"
          if [[ ! "$version" =~ ^[0-9]+(\.[0-9]+){1,3}$ ]]; then
            echo "::error::Unexpected Dalamud version '$version' from $DALAMUD_DISTRIB/version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "api=${version%%.*}" >> "$GITHUB_OUTPUT"
          echo "Dalamud $version (API ${version%%.*})"

      - name: Cache Dalamud
        id: dalamud-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.DALAMUD_HOME }}
          key: dalamud-${{ runner.os }}-${{ steps.dalamud.outputs.version }}

      # Same script in ci.yml (tools/tests/test_workflows.py runs it). The cache is saved only when the
      # job succeeds, so failing on a mismatch keeps another Dalamud out of the cache entry for this version.
      - name: Download Dalamud ${{ steps.dalamud.outputs.version }} (or use the cached copy)
        id: dalamud-files
        env:
          EXPECTED: ${{ steps.dalamud.outputs.version }}
          CACHE_HIT: ${{ steps.dalamud-cache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          # The Dalamud version in DALAMUD_HOME, from Dalamud.deps.json (empty when there is none).
          installed() {
            jq -r '.libraries | keys[] | select(startswith("Dalamud/")) | ltrimstr("Dalamud/")' \
              "$DALAMUD_HOME/Dalamud.deps.json" 2> /dev/null | head -n 1 || true
          }
          if [ "$CACHE_HIT" = true ] && [ -f "$DALAMUD_HOME/Dalamud.dll" ] && [ "$(installed)" = "$EXPECTED" ]; then
            echo "Using the cached Dalamud $EXPECTED."
          else
            if [ "$CACHE_HIT" = true ]; then
              echo "::warning::The cache for Dalamud $EXPECTED holds Dalamud '$(installed)'; downloading Dalamud again."
            fi
            curl -fsSL --retry 3 --retry-all-errors -o "$RUNNER_TEMP/dalamud.zip" "$DALAMUD_DISTRIB/latest.zip"
            rm -rf "$DALAMUD_HOME"
            mkdir -p "$DALAMUD_HOME"
            unzip -q "$RUNNER_TEMP/dalamud.zip" -d "$DALAMUD_HOME"
            rm -f "$RUNNER_TEMP/dalamud.zip"
            test -f "$DALAMUD_HOME/Dalamud.dll"
            actual="$(installed)"
            if [ "$actual" != "$EXPECTED" ]; then
              echo "::error::latest.zip contains Dalamud '$actual', but $DALAMUD_DISTRIB/version says $EXPECTED. A Dalamud release is probably still reaching the download server; re-run this job in about 10 minutes."
              exit 1
            fi
          fi
          echo "version=$(installed)" >> "$GITHUB_OUTPUT"

      - name: Build (Release, version ${{ steps.version.outputs.version }})
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: dotnet build MitCue.slnx -c Release "-p:Version=$VERSION"

      - name: Test
        run: dotnet test tests/MitCue.Core.Tests/MitCue.Core.Tests.csproj -c Release --no-build

      - name: Test the repository tools
        run: python3 -m unittest discover -s tools/tests

      - name: Write the release notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/notes.md"
          : > "$notes"
          # An annotated tag's message becomes the release notes and the changelog shown in Dalamud.
          ref="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG")"
          if [ "$(jq -r '.object.type' <<< "$ref")" = tag ]; then
            gh api "repos/$GITHUB_REPOSITORY/git/tags/$(jq -r '.object.sha' <<< "$ref")" --jq '.message' \
              | sed '/^-----BEGIN [A-Z ]*SIGNATURE-----$/,$d' > "$notes"
          fi
          if ! grep -q '[^[:space:]]' "$notes"; then
            printf '%s %s\n' "$PLUGIN" "$VERSION" > "$notes"
          fi
          echo "NOTES_FILE=$notes" >> "$GITHUB_ENV"
          cat "$notes"

      - name: Check out the '${{ env.REPO_BRANCH }}' branch
        id: repo-branch # tools/tests/test_workflows.py runs this script
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          header="http.$GITHUB_SERVER_URL/.extraheader=AUTHORIZATION: basic $auth"
          # Always the full ref name: git reads a short 'repo' as a pattern (ls-remote also matches
          # 'docs/repo') or prefers a tag called 'repo' (fetch).
          ref="refs/heads/$REPO_BRANCH"
          dir="$RUNNER_TEMP/repo-branch"
          rm -rf "$dir"
          git -c init.defaultBranch="$REPO_BRANCH" init --quiet "$dir"
          cd "$dir"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          if ! refs="$(git -c "$header" ls-remote origin "$ref")"; then
            echo "::error::Could not list the branches of $GITHUB_REPOSITORY."
            exit 1
          fi
          if cut -f2 <<< "$refs" | grep -Fx -- "$ref" > /dev/null; then
            git -c "$header" fetch --quiet --depth=1 origin "$ref"
            git checkout --quiet -B "$REPO_BRANCH" FETCH_HEAD
          else
            echo "The '$REPO_BRANCH' branch does not exist yet; this release creates it."
          fi
          echo "REPO_DIR=$dir" >> "$GITHUB_ENV"

      - name: Write repo.json and check it with Dalamud's types
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          API_LEVEL: ${{ steps.dalamud.outputs.api }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/release"
          mkdir -p "$out"
          cp "$PACKAGE_DIR/latest.zip" "$out/latest.zip"
          commit="$(git rev-parse HEAD)"
          # repo.json and its publish record (which commit each listed build is from). make-repo-json refuses
          # a lower version than the listed one, and the same version unless this run rebuilds that exact
          # release (same tag and commit): Dalamud would never offer a different build under that version
          # to the players who installed it (v1.3.0 after v1.3, or a moved tag).
          previous=()
          if [ -f "$REPO_DIR/repo.json" ]; then
            previous+=(--previous "$REPO_DIR/repo.json")
          fi
          if [ -f "$REPO_DIR/published.json" ]; then
            previous+=(--previous-record "$REPO_DIR/published.json")
          fi
          download_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$TAG/latest.zip"
          python3 tools/make-repo-json.py \
            --manifest "$PACKAGE_DIR/$PLUGIN.json" \
            --download-url "$download_url" \
            --repo-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --changelog-file "$NOTES_FILE" \
            --expect-version "$VERSION" \
            --require-api-level "$API_LEVEL" \
            --commit "$commit" \
            "${previous[@]}" \
            --output "$out/repo.json" \
            --record-output "$out/published.json"
          dotnet run --project tools/RepoJsonCheck -c Release -- "$out/repo.json" \
            --zip "$out/latest.zip" --internal-name "$PLUGIN"
          echo "RELEASE_DIR=$out" >> "$GITHUB_ENV"
          echo "DOWNLOAD_URL=$download_url" >> "$GITHUB_ENV"
          echo "BUILD_COMMIT=$commit" >> "$GITHUB_ENV"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists (a re-run, or an earlier run that stopped before publishing repo.json); replacing latest.zip."
            gh release upload "$TAG" "$RELEASE_DIR/latest.zip" --clobber
          else
            gh release create "$TAG" "$RELEASE_DIR/latest.zip" --verify-tag \
              --title "$PLUGIN $VERSION" --notes-file "$NOTES_FILE" --generate-notes
          fi

      - name: Check that latest.zip downloads without signing in
        run: |
          set -euo pipefail
          if ! curl -fsSL --retry 6 --retry-delay 5 --retry-all-errors -o "$RUNNER_TEMP/published.zip" "$DOWNLOAD_URL"; then
            echo "::error::$DOWNLOAD_URL cannot be downloaded anonymously. Dalamud downloads plugins without signing in, so the repository must be public."
            exit 1
          fi
          if ! cmp -s "$RUNNER_TEMP/published.zip" "$RELEASE_DIR/latest.zip"; then
            echo "::error::The downloaded latest.zip differs from the one this run built."
            exit 1
          fi
          echo "OK: $DOWNLOAD_URL"

      - name: Publish repo.json to the '${{ env.REPO_BRANCH }}' branch
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          cp "$RELEASE_DIR/repo.json" "$RELEASE_DIR/published.json" "$REPO_DIR/"
          cd "$REPO_DIR"
          git add repo.json published.json
          if git diff --cached --quiet; then
            echo "repo.json is unchanged."
          else
            git commit --quiet -m "repo.json: $PLUGIN $VERSION ($TAG, ${BUILD_COMMIT:0:12})"
            git -c "http.$GITHUB_SERVER_URL/.extraheader=AUTHORIZATION: basic $auth" \
              push --quiet origin "HEAD:refs/heads/$REPO_BRANCH"
          fi

      - name: Summary
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          DALAMUD: ${{ steps.dalamud-files.outputs.version }}
        run: |
          {
            echo "## $PLUGIN $VERSION"
            echo
            echo "- Release: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG"
            echo "- Built against Dalamud $DALAMUD"
            echo "- Custom plugin repository URL (Dalamud: /xlsettings > Experimental > Custom Plugin Repositories):"
            echo
            echo "  \`https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$REPO_BRANCH/repo.json\`"
            echo
            echo "raw.githubusercontent.com may serve the previous repo.json for a few minutes."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the release files with the run
        uses: actions/upload-artifact@v4
        with:
          name: MitCue-release-${{ steps.version.outputs.version }}
          path: ${{ env.RELEASE_DIR }}
          if-no-files-found: error
          retention-days: 90
