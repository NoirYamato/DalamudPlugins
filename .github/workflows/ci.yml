# Builds MitCue against the current Dalamud release, runs the tests and uploads the plugin zip.
# The same steps run in release.yml when a v* tag is pushed.
name: CI

on:
  push:
    # 'repo' only holds the published repo.json (see release.yml).
    branches-ignore: [repo]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  DALAMUD_DISTRIB: https://goatcorp.github.io/dalamud-distrib
  PLUGIN: MitCue
  PACKAGE_DIR: src/MitCue/bin/Release/MitCue

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Look up the current Dalamud release
        id: dalamud
        run: |
          set -euo pipefail
          echo "DALAMUD_HOME=$RUNNER_TEMP/dalamud" >> "$GITHUB_ENV"
          version="$(curl -fsSL --retry 3 --retry-all-errors "$DALAMUD_DISTRIB/version" | jq -r '.AssemblyVersion // empty')"
          if [[ ! "$version" =~ ^[0-9]+(\.[0-9]+){1,3}$ ]]; then
            echo "::error::Unexpected Dalamud version '$version' from $DALAMUD_DISTRIB/version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "api=${version%%.*}" >> "$GITHUB_OUTPUT"
          echo "Dalamud $version (API ${version%%.*})"

      - name: Cache Dalamud
        id: dalamud-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.DALAMUD_HOME }}
          key: dalamud-${{ runner.os }}-${{ steps.dalamud.outputs.version }}

      - name: Download Dalamud ${{ steps.dalamud.outputs.version }}
        if: steps.dalamud-cache.outputs.cache-hit != 'true'
        env:
          EXPECTED: ${{ steps.dalamud.outputs.version }}
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-all-errors -o "$RUNNER_TEMP/dalamud.zip" "$DALAMUD_DISTRIB/latest.zip"
          rm -rf "$DALAMUD_HOME"
          mkdir -p "$DALAMUD_HOME"
          unzip -q "$RUNNER_TEMP/dalamud.zip" -d "$DALAMUD_HOME"
          rm -f "$RUNNER_TEMP/dalamud.zip"
          test -f "$DALAMUD_HOME/Dalamud.dll"
          actual="$(jq -r '.libraries | keys[] | select(startswith("Dalamud/"))' "$DALAMUD_HOME/Dalamud.deps.json" | head -n 1)"
          if [ "$actual" != "Dalamud/$EXPECTED" ]; then
            echo "::warning::latest.zip contains $actual, the version file said $EXPECTED (a Dalamud release is probably in progress)"
          fi

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/packages.lock.json', 'Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore MitCue.slnx

      - name: Build (Release)
        run: dotnet build MitCue.slnx -c Release --no-restore

      - name: Test
        run: >-
          dotnet test tests/MitCue.Core.Tests/MitCue.Core.Tests.csproj -c Release --no-build
          --logger trx --results-directory TestResults

      - name: Test the repository tools
        run: python3 -m unittest discover -s tools/tests -v

      - name: Check the plugin zip and a sample repo.json against Dalamud
        env:
          API_LEVEL: ${{ steps.dalamud.outputs.api }}
        run: |
          set -euo pipefail
          python3 tools/make-repo-json.py \
            --manifest "$PACKAGE_DIR/$PLUGIN.json" \
            --download-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/ci/latest.zip" \
            --repo-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --require-api-level "$API_LEVEL" \
            --output "$RUNNER_TEMP/repo.json"
          dotnet run --project tools/RepoJsonCheck -c Release -- "$RUNNER_TEMP/repo.json" \
            --zip "$PACKAGE_DIR/latest.zip" --internal-name "$PLUGIN" --strict

      - name: Upload the plugin zip
        uses: actions/upload-artifact@v4
        with:
          name: MitCue-plugin
          path: |
            ${{ env.PACKAGE_DIR }}/latest.zip
            ${{ env.PACKAGE_DIR }}/${{ env.PLUGIN }}.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
          if-no-files-found: ignore
          retention-days: 14
