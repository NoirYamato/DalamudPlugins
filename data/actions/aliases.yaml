# MitCue shorthand dictionary (draft). Field reference and token coverage: docs/research/actions.md
#
# Keys are normalized shorthand: lowercase, apostrophes removed, every other character that is not a
# letter, digit or '%' replaced by a space, runs of spaces collapsed, trimmed ("Nature's Minne" ->
# "natures minne", "Co-Tank" -> "co tank", "30%" -> "30%").
#
# A value is one of:
#   "Action Name"                                  one action, any job that has it
#   {actions: [...], job: XXX, sequence: true, note_only: true, note: "...", targeted: [...]}
#   [ {...}, {...} ]                               several expansions, usually one per job
# Action names must match data/actions/actions.yaml exactly. Names are resolved at the plan's sync level:
# an action replaced by an upgrade below that level resolves to the upgrade (Succor -> Concitation at 96),
# and an upgrade named in a plan below its level resolves back to the base action (Heart of Corundum ->
# Heart of Stone at 80).
# sequence: the actions are pressed in this order. note_only: show the text as a note, resolve nothing.
# targeted: actions to use instead when the cell names another player ("Short CD to R1", "... Co-Tank").
