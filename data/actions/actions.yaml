# MitCue action knowledge base (draft).
# Generated from FFXIV game data: xivapi/ffxiv-datamining csv/en, patch 7.58 (commit 52a72b38, 2026-11-10);
# level-dependent tooltip values from the same repository at patch 7.4 (commit 6a2329d), whose raw macros
# evaluated at level 100 match the 7.58 tooltips for every action below. Field reference, sources and
# verification: docs/research/actions.md. Regenerate rather than hand-edit numbers.
#
# Level maps ({level: value}) are thresholds: the value applies from that level until the next key.
# duration: main effect in seconds (0 = no lasting effect at that level). sync: the main duration at the
# three ultimate sync levels; null = not usable at that level (not learned yet, or replaced by an upgrade).
# recast: seconds at level 100 after traits; recast_by_level only when a trait changes it.
# charges: only when more than 1 at some level. cost: job resource; mp: MP cost. cooldown_group /
# additional_cooldown_group: Action sheet CooldownGroup / AdditionalCooldownGroup (58 = the GCD).
