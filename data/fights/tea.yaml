# MitCue fight catalog (FIRST DRAFT): The Epic of Alexander (Ultimate). Schema: docs/DESIGN.md section 3.1.
# Timeline: data/timelines/the_epic_of_alexander.txt = cactbot ui/raidboss/data/05-shb/ultimate/the_epic_of_alexander.txt @ e79ea7f1.
# Every hit/entry pair and every value in hits is a timeline entry, timeline_additions included (checked). Damage
# events were chosen from the cactbot timeline and triggers, BossMod (awgil/ffxiv_bossmod @ 6e410ef8, BossMod.Ultimate)
# and Action.csv; see docs/research/mechanics.md. Mapped against the LPDU sheet "[LPDU] TEA Heal/Mit" (untimed rows,
# so no calibration). Player-timed damage that has no timeline entry (doll feeds, mine soaks, crystal explosions) is
# anchored on the fixed entry that marks it; see the mechanic comments.
# kind "marker" = MechanicKind.Marker (no damage). Aliases marked "# unverified" are community shorthand that was
# not checked against a source; the others are cactbot or BossMod names and plain-text forms.
fight: tea
name: The Epic of Alexander (Ultimate)
territory: 887
sync_level: 80
timeline: the_epic_of_alexander.txt
# cactbot folds the P3 DPS check into one entry ("J Storm + Waves x16", 705.7, duration 50). The J Waves (4877, a
# Helper's action, no cast) are added as sync lines so that each wave has a time to anchor and sync on. BossMod
# (TEAStates.cs P3SummonAlexander): J Storm 0.2 s after Alexander Prime turns untargetable, the Divine Judgment cast
# 1.3 s after it, "j wave 1" 4.1 s after the cast start, "then every 3s": wave 1 = J Storm + 5.2 s = 710.9, wave 16 =
# 755.9 (cactbot: 705.7 + 50). Windows of 1.4 s keep every event on its own wave (neighbours are 3 s apart; a
# narrower window only leaves larger errors unsynced). No source: the helper's name is not needed. Not checked
# against a log. Waves after Brute Justice dies never fire; the 4879 sync (771.9) ends the check.
